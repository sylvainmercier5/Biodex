# Configuration Netlify pour BioDex
[build]
  # v1.97 — l'appli est précompilée (outils/precompiler.mjs) dans dist/ : plus de Babel dans le navigateur.
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Le site publie tout le dépôt : on cache ce qui n'est pas l'appli
# (SQL, outils de test, service BioCLIP et son guide d'installation).
[[redirects]]
  from = "/supabase/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/outils/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/serveur-bioclip/*"
  to = "/404"
  status = 404
  force = true
